# Render.com deployment configuration
# This file enables automatic deployments from your GitHub repository

services:
  # Web service for the Yahoo Mail MCP Server
  - type: web
    name: yahoo-mail-mcp-server
    runtime: docker
    plan: free  # Change to 'starter' or higher for production use
    region: oregon  # Choose: oregon, frankfurt, singapore, ohio

    # Build configuration
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Environment variables (set sensitive values in Render Dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRANSPORT_MODE
        value: sse
      - key: PORT
        fromService:
          type: web
          name: yahoo-mail-mcp-server
          property: port
      - key: YAHOO_EMAIL
        sync: false  # Set this in Render Dashboard (Settings > Environment)
      - key: YAHOO_APP_PASSWORD
        sync: false  # Set this in Render Dashboard (Settings > Environment)

      # REQUIRED. The server refuses to start in SSE mode without these, because
      # without them anyone who finds the URL can read and delete the mailbox.
      #   Client ID:     openssl rand -hex 16
      #   Client Secret: openssl rand -hex 32
      - key: OAUTH_CLIENT_ID
        sync: false  # Set this in Render Dashboard (Settings > Environment)
      - key: OAUTH_CLIENT_SECRET
        sync: false  # Set this in Render Dashboard (Settings > Environment)

      # Optional. MCP requests are rejected unless the Host header matches, which
      # blocks DNS rebinding. Defaults to RENDER_EXTERNAL_HOSTNAME, which Render
      # injects automatically, so this only needs setting behind a custom domain.
      # - key: MCP_ALLOWED_HOSTS
      #   value: mail.example.com

    # Health check configuration
    healthCheckPath: /health

    # Auto-deploy settings
    autoDeploy: true

    # Scaling (for paid plans)
    numInstances: 1

    # Resource limits (for paid plans)
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
